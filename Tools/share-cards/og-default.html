<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
body{font-family:'Lexend',sans-serif;color:#f5f5f7;position:relative;
 background:radial-gradient(ellipse 60% 75% at 26% 52%, rgba(201,162,75,.16), rgba(0,0,0,0) 70%),#000}
.frame{position:absolute;inset:28px;border:1px solid rgba(201,162,75,.30);border-radius:22px}
.mark{position:absolute;left:78px;top:105px;width:420px;height:420px}
.copy{position:absolute;left:540px;top:0;bottom:0;right:80px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#c9a24b;font-weight:400;margin:0 0 22px}
h1{font-size:88px;line-height:1;font-weight:600;letter-spacing:-.02em;margin:0 0 26px;
 background:linear-gradient(180deg,#f7e9c4 0%,#c9a24b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:34px;font-weight:300;line-height:1.25;margin:0 0 34px;color:#f5f5f7}
.rule{width:72px;height:2px;background:#c9a24b;margin:0 0 26px}
.url{font-size:24px;font-weight:400;color:#a1a1a6;letter-spacing:.01em;margin:0}
</style></head><body>
<div class="frame"></div>
<img class="mark" src="../../Resources/images/brand/logo-mark.png" alt="">
<div class="copy">
  <p class="eyebrow">Apps · Maps · Systems</p>
  <h1>KinNoKi Labs</h1>
  <p class="tag">Building Tools That<br>Make Sense.</p>
  <div class="rule"></div>
  <p class="url">kinnokilabs.com</p>
</div>
</body></html>
